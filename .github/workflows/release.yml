name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish SMTPRelay.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "SMTPRelay-$env:TAG-win-x64"
          New-Item -ItemType Directory -Path "artifacts/$name" | Out-Null
          Copy-Item publish/SMTPRelay.exe, publish/appsettings.json, README.md, LICENSE -Destination "artifacts/$name"
          Compress-Archive -Path "artifacts/$name/*" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "artifacts/$name.zip.sha256" -Encoding ascii

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG (Get-ChildItem artifacts -File).FullName --title $env:TAG --generate-notes --verify-tag
